<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>टोटल बिल</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>

<div class="top-bar no-print">
  <div class="left">
    <button class="btn link" onclick="location.href='index.html'">&#8592; डैशबोर्ड</button>
    <span id="saveStatus" class="save-status"></span>
  </div>
  <div class="right">
    <button class="theme-toggle no-print" onclick="toggleTheme()"></button>
    <button class="btn" id="saveBtn" onclick="saveBill()">&#128190; सेव करें</button>
  </div>
</div>

<div id="pages"></div>

<div class="actions">
  <button class="btn" onclick="removeRow()">&#10134; पंक्ति हटाएं</button>
  <button class="btn" onclick="addRow()">&#10133; नई पंक्ति जोड़ें</button>
  <button class="btn" onclick="addPage()">&#128196; नया पेज जोड़ें</button>
  <button class="btn" onclick="removeLastPage()">&#128465;&#65039; अंतिम पेज हटाएं</button>
  <button class="btn alt" onclick="resetManual()">&#8634; ऑटो कैलकुलेशन पर लौटें</button>
  <button class="btn" onclick="downloadPDF()">&#128196; Save as PDF</button>
  <button class="btn share" id="shareBtn" onclick="sharePDF()">&#128228; शेयर करें (WhatsApp, Bluetooth आदि)</button>
  <button class="btn" onclick="window.print()">&#128424;&#65039; प्रिंट करें</button>
  <div>अंतिम ग्रैंड टोटल: <span id="finalGrandTotal">&#8377; 0.00</span></div>
 
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app-common.js"></script>
<script src="bill-total.js"></script>
</body>
</html>
